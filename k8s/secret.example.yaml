# EXAMPLE ONLY - never commit a real Secret.
#
# Both keys are OPTIONAL. The Deployment references them with `optional: true`, so
# the application runs correctly without this Secret (notifications simply disabled).
#
# To use locally, copy to secret.yaml, fill in real values, and apply. secret.yaml
# is git-ignored. Create it without writing values into shell history, e.g.:
#
#   kubectl -n aiops create secret generic aiops-analyzer-secret \
#     --from-literal=NOTIFICATION_WEBHOOK_URL='https://your-webhook' \
#     --from-literal=ADMIN_TOKEN='a-long-random-token'
#
# The stringData form below is shown for clarity; prefer `kubectl create secret`
# or a sealed/external secret manager for anything real.
apiVersion: v1
kind: Secret
metadata:
  name: aiops-analyzer-secret
  namespace: aiops
  labels:
    app.kubernetes.io/name: aiops-analyzer
type: Opaque
stringData:
  # Optional incident-notification webhook (Slack/Discord/ntfy/webhook.site).
  NOTIFICATION_WEBHOOK_URL: "REPLACE_ME_OPTIONAL"
  # Optional token required on /admin/* fault-injection routes.
  ADMIN_TOKEN: "REPLACE_ME_OPTIONAL"
