apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-analyzer
  namespace: aiops
  labels:
    app.kubernetes.io/name: aiops-analyzer
    app.kubernetes.io/part-of: aiops-incident-log-analyzer
spec:
  # Two replicas demonstrate multi-replica behaviour and shared log/incident volume.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aiops-analyzer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiops-analyzer
      annotations:
        # Scraped by observability/prometheus.yml (pod-annotation discovery).
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: aiops-incident-log-analyzer:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: aiops-analyzer-config
          env:
            # Optional secret (webhook token). The Secret is optional; if absent the
            # app runs without notifications. Never commit a real Secret.
            - name: NOTIFICATION_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: aiops-analyzer-secret
                  key: NOTIFICATION_WEBHOOK_URL
                  optional: true
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aiops-analyzer-secret
                  key: ADMIN_TOKEN
                  optional: true
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Meaningful probes backed by real application endpoints.
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: incidents
              mountPath: /app/incidents/generated
      volumes:
        # emptyDir keeps logs/incidents local to the pod and off any external store.
        # For multi-replica shared analysis, swap for a ReadWriteMany PVC.
        - name: logs
          emptyDir: {}
        - name: incidents
          emptyDir: {}
