[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiops-incident-log-analyzer"
version = "1.0.0"
description = "AIOps Incident & Log Analyzer - local AI-assisted incident analysis on Kubernetes (zero cost)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "PyYAML>=6.0",
]

[tool.setuptools]
packages = ["app", "app.analyzer", "app.ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["incidents/generated", "incidents/examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "B008",  # FastAPI dependency injection in argument defaults
    "SIM108",
    # SIM105 prefers contextlib.suppress over try/except/pass. Several guards here are
    # deliberate fire-and-forget blocks (metrics/notifications must never break the
    # analysis path) where the inline rationale comment reads better than suppress().
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
