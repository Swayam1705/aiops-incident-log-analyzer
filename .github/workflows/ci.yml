name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Core CI runs entirely on GitHub-hosted runners with no paid services, no cluster,
# and no Ollama. The LLM boundary is mocked at the HTTP layer in tests; the rest of
# the pipeline is exercised for real.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff PyYAML httpx

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit + integration tests (pytest)
        run: pytest -q

      - name: Offline end-to-end demo (no cluster, no Ollama)
        run: python scripts/run_demo.py

      - name: Evaluation vs ground truth
        run: python scripts/run_evaluation.py --window-size 200

  config-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML/JSON configuration parses
        run: |
          python - <<'PY'
          import json, glob, yaml, sys
          ok = True
          for f in glob.glob("k8s/*.yaml") + glob.glob("observability/**/*.yml", recursive=True):
              try:
                  list(yaml.safe_load_all(open(f)))
                  print("YAML OK", f)
              except Exception as e:
                  ok = False; print("YAML FAIL", f, e)
          for f in glob.glob("observability/grafana/dashboards/*.json"):
              try:
                  json.load(open(f)); print("JSON OK", f)
              except Exception as e:
                  ok = False; print("JSON FAIL", f, e)
          sys.exit(0 if ok else 1)
          PY

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Helm lint + template render
        run: |
          helm lint helm/
          helm template test helm/ --namespace aiops --set secret.create=true >/dev/null

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build -f docker/Dockerfile -t aiops-incident-log-analyzer:ci .

      - name: Smoke-test image health endpoint
        run: |
          docker run -d --name aiops -p 8000:8000 aiops-incident-log-analyzer:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health/ready; then echo "READY"; break; fi
            sleep 1
          done
          curl -fsS http://localhost:8000/health/ready
          curl -fsS http://localhost:8000/metrics | head -5
          docker logs aiops | tail -20
