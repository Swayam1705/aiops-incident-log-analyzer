{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aiops.secretName" . }}
  labels:
    {{- include "aiops.labels" . | nindent 4 }}
type: Opaque
stringData:
  NOTIFICATION_WEBHOOK_URL: {{ .Values.secret.data.NOTIFICATION_WEBHOOK_URL | quote }}
  ADMIN_TOKEN: {{ .Values.secret.data.ADMIN_TOKEN | quote }}
{{- end }}
