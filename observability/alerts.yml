# Alerting rules. These target the real metrics exposed by the application.
groups:
  - name: aiops-application
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{outcome="error"}[2m]))
            /
          clamp_min(sum(rate(http_requests_total[2m])), 0.001) > 0.10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 5xx error rate on {{ $labels.app }}"
          description: "More than 10% of requests are failing over the last 2 minutes."

      - alert: IncidentCreated
        expr: increase(incidents_total[5m]) > 0
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "New incident detected ({{ $labels.root_cause }})"
          description: "The analyzer created an incident with severity {{ $labels.severity }}."

      - alert: HighP95Latency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le, app)) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on {{ $labels.app }}"
          description: "p95 request latency exceeded 1s for 2 minutes."

      - alert: LLMAvailabilityDegraded
        expr: increase(llm_calls_total{outcome!="ok"}[10m]) > 5
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "LLM advisory stage failing"
          description: "Multiple LLM analysis attempts failed; rule-based analysis still active."
