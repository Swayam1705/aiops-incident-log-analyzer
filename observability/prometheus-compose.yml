# Prometheus configuration for the Docker Compose (non-Kubernetes) mode.
# The app is reachable at the compose service name "app" on port 8000.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: aiops-app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
        labels:
          app: aiops-analyzer
          namespace: compose
